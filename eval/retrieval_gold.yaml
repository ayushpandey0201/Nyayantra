# Gold set for Stage 4 (retrieval). Each question lists one or more gold GROUPS; a group is satisfied
# when ANY of its units is retrieved. "SC-2006-PERCEPT:*" means any paragraph of that judgment.
#   hit@k     = at least one group satisfied in the top k
#   recall@k  = share of groups satisfied in the top k (all groups count equally)
# Questions Q01-Q18 come from the earlier prototype (docs/reference/legal_services_v1, re-keyed to unit IDs);
