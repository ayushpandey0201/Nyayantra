  - {id: BNS-2023,   file: BNS-2023.pdf,   title: "The Bharatiya Nyaya Sanhita, 2023",              number: "Act No. 45 of 2023", status: in_force, domains: [criminal]}
  - {id: BSA-2023,   file: BSA-2023.pdf,   title: "The Bharatiya Sakshya Adhiniyam, 2023",          number: "Act No. 47 of 2023", status: in_force, domains: [evidence]}
