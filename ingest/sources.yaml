  - {id: IPC-1860,   file: IPC-1860.pdf,   title: "The Indian Penal Code, 1860",                    number: "Act No. 45 of 1860", status: repealed, repealed_by: BNS-2023, repealed_on: 2024-07-01, domains: [criminal]}
  - {id: IEA-1872,   file: IEA-1872.pdf,   title: "The Indian Evidence Act, 1872",                  number: "Act No. 1 of 1872",  status: repealed, repealed_by: BSA-2023, repealed_on: 2024-07-01, domains: [evidence]}

rules:   # also saved into data/raw/acts/
  - {id: DPDPR-2025, file: DPDPR-2025.pdf, title: "Digital Personal Data Protection Rules, 2025", where: "India Code > Subordinate Legislation, or MeitY website", parent: DPDPA-2023, domains: [privacy]}
  - {id: BCIR-PVI,   file: BCIR-PVI.pdf,   title: "Bar Council of India Rules, Part VI (Rules on Professional Standards)", where: "barcouncilofindia.org > Rules", parent: AA-1961, domains: [ethics]}

