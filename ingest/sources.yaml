# Nyayantra corpus. Acts are downloaded BY HAND from India Code (indiacode.gov.in):
# its Terms of Use (updated 22 June 2026) forbid automated access without written permission.
# Save each PDF into data/raw/acts/ with the exact file name below.
# Supreme Court judgments come from the AWS Open Data mirror (CC-BY-4.0) and are fetched by script.

acts:
  - {id: ICA-1872,   file: ICA-1872.pdf,   title: "The Indian Contract Act, 1872",                  number: "Act No. 9 of 1872",  status: in_force, domains: [contract]}
  - {id: SRA-1963,   file: SRA-1963.pdf,   title: "The Specific Relief Act, 1963",                  number: "Act No. 47 of 1963", status: in_force, domains: [contract, remedies]}
  - {id: ACA-1996,   file: ACA-1996.pdf,   title: "The Arbitration and Conciliation Act, 1996",     number: "Act No. 26 of 1996", status: in_force, domains: [arbitration, contract]}
  - {id: LA-1963,    file: LA-1963.pdf,    title: "The Limitation Act, 1963",                       number: "Act No. 36 of 1963", status: in_force, domains: [procedure, contract]}
  - {id: SGA-1930,   file: SGA-1930.pdf,   title: "The Sale of Goods Act, 1930",                    number: "Act No. 3 of 1930",  status: in_force, domains: [contract]}
  - {id: ITA-2000,   file: ITA-2000.pdf,   title: "The Information Technology Act, 2000",           number: "Act No. 21 of 2000", status: in_force, domains: [technology, privacy]}
  - {id: DPDPA-2023, file: DPDPA-2023.pdf, title: "The Digital Personal Data Protection Act, 2023", number: "Act No. 22 of 2023", status: in_force, domains: [privacy]}
  - {id: CA-1957,    file: CA-1957.pdf,    title: "The Copyright Act, 1957",                        number: "Act No. 14 of 1957", status: in_force, domains: [ip]}
