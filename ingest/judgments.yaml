  - {id: SC-2014-ASSOCIATE-BUILDERS, path: "2014_13_895_956", short: "Associate Builders v. DDA",                      topics: [public_policy, arbitral_award_challenge], statutes: [ACA-1996:s34], treatment: limited, note: "Explained in Ssangyong (2019) in light of the 2015 amendment."}
  - {id: SC-2019-SSANGYONG,       path: "2019_7_522_606",     short: "Ssangyong Engineering & Construction v. NHAI",   topics: [public_policy, patent_illegality, arbitral_award_challenge], statutes: [ACA-1996:s34], treatment: good_law}
  - {id: SC-2019-PERKINS,         path: "2019_17_275_304",    short: "Perkins Eastman Architects v. HSCC (India)",     topics: [arbitrator_appointment, unilateral_appointment], statutes: [ACA-1996:s11, ACA-1996:s12], treatment: good_law}
  - {id: SC-2019-HCC,             path: "2019_17_331_395",    short: "Hindustan Construction Co. v. Union of India",   topics: [arbitral_award_challenge, automatic_stay], statutes: [ACA-1996:s34, ACA-1996:s36], treatment: good_law}
  - {id: SC-2019-DYNA,            path: "2019_15_295_317",    short: "Dyna Technologies v. Crompton Greaves",          topics: [reasoned_award, arbitral_award_challenge], statutes: [ACA-1996:s31, ACA-1996:s34], treatment: good_law}
  - {id: SC-2020-VIDYA-DROLIA,    path: "2020_11_1001_1180",  short: "Vidya Drolia v. Durga Trading Corporation",      topics: [arbitrability, referral], statutes: [ACA-1996:s8, ACA-1996:s11], treatment: good_law}
  - {id: SC-2023-NN-GLOBAL,       path: "2023_9_285_492",     short: "N.N. Global Mercantile v. Indo Unique Flame (Constitution Bench)", topics: [stamp_duty, arbitration_agreement], statutes: [ACA-1996:s11], treatment: overruled, note: "Overruled by the 7-judge bench in In re Interplay (2023 INSC 1066)."}
  - {id: SC-2023-INTERPLAY-STAMP, path: "2023_15_1081_1212",  short: "In re Interplay between Arbitration Agreements and the Stamp Act", topics: [stamp_duty, arbitration_agreement, referral], statutes: [ACA-1996:s8, ACA-1996:s11, ACA-1996:s16], treatment: good_law, note: "Unstamped arbitration agreement is not void; stamp objection is for the tribunal."}
  - {id: SC-2024-CORE-ECI-SPIC,   path: "2024_11_2173_2328",  short: "Central Organisation for Railway Electrification v. ECI SPIC SMO MCML (JV)", topics: [arbitrator_appointment, unilateral_appointment, independence], statutes: [ACA-1996:s11, ACA-1996:s12, ACA-1996:s18], treatment: good_law}
  - {id: SC-2025-GAYATRI-BALASAMY, path: "2025_4_2080_2236",  short: "Gayatri Balasamy v. ISG Novasoft Technologies",  topics: [modification_of_award, arbitral_award_challenge], statutes: [ACA-1996:s34], treatment: good_law, note: "Courts have a limited power to modify an award under s.34."}
  # Privacy, IT Act, electronic evidence
  - {id: SC-2017-PUTTASWAMY,      path: "2017_10_569_999",    short: "Justice K.S. Puttaswamy (Retd.) v. Union of India (Privacy)", topics: [privacy, fundamental_rights, informational_privacy], statutes: [], treatment: good_law, reporter_citations: ["(2017) 10 SCC 1"], note: "Nine-judge bench: privacy is a fundamental right under Article 21."}
  - {id: SC-2018-PUTTASWAMY-AADHAAR, path: "2018_8_1_1076",   short: "Justice K.S. Puttaswamy (Retd.) v. Union of India (Aadhaar)", topics: [privacy, data_protection, proportionality], statutes: [], treatment: good_law}
  - {id: SC-2010-SELVI,           path: "2010_5_381_594",     short: "Selvi v. State of Karnataka",                    topics: [privacy, self_incrimination, consent], statutes: [], treatment: good_law}
