# 50 Supreme Court judgments chosen for the test questions (contract, arbitration, privacy/IT,
# evidence, criminal, professional ethics, copyright, consumer).
# Source: AWS Open Data "indian-supreme-court-judgments" (CC-BY-4.0), official S.C.R. text.
# `path` is the dataset's file key; citation fields are read from its metadata at fetch time.
# `statutes`: unit_ids in our corpus that the judgment interprets (curated).
# `treatment`: good_law | overruled | limited (curated; `note` says why). Check before relying on it.

judgments:
  # Contract: restraint of trade (s.27)
  - {id: SC-1967-GOLIKARI,        path: "1967_2_378_390",     short: "Niranjan Shankar Golikari v. Century Spinning",   topics: [non_compete, restraint_of_trade], statutes: [ICA-1872:s27], treatment: good_law, note: "Negative covenant operating during employment is not a restraint of trade."}
  - {id: SC-1980-SUPERINTENDENCE, path: "1980_3_1278_1301",   short: "Superintendence Co. of India v. Krishan Murgai",  topics: [non_compete, restraint_of_trade], statutes: [ICA-1872:s27], treatment: good_law, note: "Post-employment restraint is void under s.27 regardless of reasonableness."}
  - {id: SC-1995-GUJARAT-BOTTLING, path: "S_1995_2_514_555",  short: "Gujarat Bottling Co. v. Coca Cola Co.",          topics: [non_compete, exclusivity, restraint_of_trade], statutes: [ICA-1872:s27], treatment: good_law}
  - {id: SC-2006-PERCEPT,         path: "2006_3_146_174",     short: "Percept D'Mark (India) v. Zaheer Khan",          topics: [non_compete, right_of_first_refusal, restraint_of_trade], statutes: [ICA-1872:s27], treatment: good_law, note: "Post-term negative covenant void under s.27."}
  # Contract: damages, penalty, frustration, formation, unfair terms
  - {id: SC-1961-MURLIDHAR,       path: "1962_1_653_661",     short: "Murlidhar Chiranjilal v. Harishchandra Dwarkadas", topics: [damages, mitigation], statutes: [ICA-1872:s73], treatment: good_law}
  - {id: SC-1962-CHUNILAL-MEHTA,  path: "S_1962_3_549_564",   short: "Sir Chunilal V. Mehta & Sons v. Century Spinning", topics: [damages, liquidated_damages], statutes: [ICA-1872:s73, ICA-1872:s74], treatment: good_law}
  - {id: SC-1963-FATEH-CHAND,     path: "1964_1_515_534",     short: "Fateh Chand v. Balkishan Das",                   topics: [liquidated_damages, penalty, earnest_money], statutes: [ICA-1872:s74], treatment: good_law}
  - {id: SC-1969-MAULA-BUX,       path: "1970_1_928_935",     short: "Maula Bux v. Union of India",                    topics: [liquidated_damages, earnest_money, forfeiture], statutes: [ICA-1872:s74], treatment: good_law}
  - {id: SC-2003-SAW-PIPES,       path: "2003_3_691_741",     short: "ONGC v. Saw Pipes Ltd.",                         topics: [liquidated_damages, public_policy, arbitral_award_challenge], statutes: [ICA-1872:s73, ICA-1872:s74, ACA-1996:s34], treatment: limited, note: "Its wide 'patent illegality' reading of public policy was narrowed by the 2015 amendment to s.34 (see Ssangyong, 2019)."}
  - {id: SC-2015-KAILASH-NATH,    path: "2015_1_627_666",     short: "Kailash Nath Associates v. DDA",                 topics: [liquidated_damages, penalty, earnest_money], statutes: [ICA-1872:s74], treatment: good_law, note: "Compensation under s.74 needs proof of loss unless loss is impossible to prove; reasonable compensation up to the stated sum."}
  - {id: SC-1953-SATYABRATA,      path: "1954_1_310_329",     short: "Satyabrata Ghose v. Mugneeram Bangur & Co.",     topics: [frustration, impossibility, force_majeure], statutes: [ICA-1872:s56], treatment: good_law}
  - {id: SC-2017-ENERGY-WATCHDOG, path: "2017_3_153_213",     short: "Energy Watchdog v. CERC",                        topics: [frustration, force_majeure], statutes: [ICA-1872:s32, ICA-1872:s56], treatment: good_law}
  - {id: SC-1965-KEDIA,           path: "1966_1_656_682",     short: "Bhagwandas Goverdhandas Kedia v. Girdharilal Parshottamdas", topics: [formation, acceptance, jurisdiction], statutes: [ICA-1872:s4], treatment: good_law, note: "Contract by telephone is made where acceptance is heard."}
  - {id: SC-2010-TRIMEX,          path: "2010_1_820_868",     short: "Trimex International FZE v. Vedanta Aluminium",  topics: [formation, email_contract, arbitration_agreement], statutes: [ICA-1872:s4, ACA-1996:s7], treatment: good_law, note: "Concluded contract can arise from e-mail exchanges."}
  - {id: SC-1986-BROJO-NATH,      path: "1986_2_278_387",     short: "Central Inland Water Transport Corp. v. Brojo Nath Ganguly", topics: [unconscionable_terms, standard_form_contract, public_policy], statutes: [ICA-1872:s23], treatment: good_law}
  - {id: SC-1989-GREEN-RUBBER,    path: "S_1989_2_275_286",   short: "Bihar State Electricity Board v. Green Rubber Industries", topics: [standard_form_contract], statutes: [ICA-1872:s23], treatment: good_law}
