# Topic tags for statutory units. A tag applies when its pattern matches the section HEADING, or the
# chapter/part title in its PATH (case-insensitive regex). Headings are printed by the legislature, so
# this stays precise; the section body is not searched. Slugs match the judgment topics in
# judgments.yaml so a filter like topics @> '{non_compete}' finds both the Act and the cases.
# Optional `only:` limits a tag to some instruments.

restraint_of_trade:      {heading: "restraint of trade"}
non_compete:             {heading: "restraint of trade"}
penalty:                 {heading: "penalty stipulated|breach of contract where penalty"}
liquidated_damages:      {heading: "penalty stipulated|compensation for (loss|breach)"}
damages:                 {heading: "compensation for (loss|breach)|damages"}
frustration:             {heading: "impossible|impossibility"}
force_majeure:           {heading: "impossible|contingent"}
formation:               {heading: "proposal|acceptance|communication|revocation|what agreements are contracts", only: [ICA-1872, SGA-1930]}
acceptance:              {heading: "acceptance"}
consent:                 {only: [ICA-1872, DPDPA-2023, DPDPR-2025, BNS-2023, IPC-1860, SGA-1930], heading: "\\bconsent\\b|free consent|coercion|undue influence|fraud|misrepresentation|mistake"}
capacity:                {heading: "competent to contract|minor|sound mind"}
void_agreements:         {heading: "\\bvoid\\b|unlawful|consideration and object"}
consideration:           {heading: "consideration"}
contingent_contracts:    {path: "contingent contracts"}
performance:             {path: "performance of (the )?contract"}
quasi_contract:          {path: "relations resembling those created by contract"}
indemnity:               {heading: "indemnity"}
guarantee:               {heading: "guarantee|surety"}
bailment:                {path: "bailment"}
